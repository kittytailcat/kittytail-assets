<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GitHub Repo Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #111111;
            --bg: #F7F7F8;
            --card-bg: #FFFFFF;
            --border: #EAEAEA;
            --text-main: #111111;
            --text-secondary: #888888;
            
            --radius-card: 24px;
            --radius-item: 16px;
            --radius-input: 16px; /* Heavy border radii */
            --radius-btn: 16px;
            --radius-thumb: 12px;
            
            --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.03);
            --shadow-modal: 0 -12px 40px rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: calc(38px + env(safe-area-inset-top)) 20px calc(120px + env(safe-area-inset-bottom));
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius-card);
            padding: 26px 24px;
            box-shadow: var(--shadow-card);
            border: 1px solid var(--border);
            transition: transform 0.4s ease;
        }

        .title {
            font-size: 20px;
            font-weight: 750;
            margin-bottom: 8px;
            color: var(--primary);
            letter-spacing: -0.4px;
        }

        .sub {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .input-group {
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            padding-left: 2px;
        }

        .input-field, .select-field {
            width: 100%;
            background: #FAFAFA;
            border: 1px solid var(--border);
            border-radius: var(--radius-input);
            padding: 15px 16px;
            font-size: 14px;
            color: var(--text-main);
            font-family: inherit;
            transition: all 0.2s ease;
            appearance: none;
            outline: none;
            height: 100%; /* Ensures it fills standard height when stretched */
        }

        .input-field:focus, .select-field:focus {
            background: #FFFFFF;
            border-color: var(--primary);
        }

        .select-wrapper {
            position: relative;
            flex: 1;
            display: flex;
        }
        
        .select-wrapper::after {
            content: "▾";
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 800;
        }

        .flex-row-stretch {
            display: flex;
            gap: 8px;
            align-items: stretch; /* CRITICAL: Makes items equal height */
        }

        .btn {
            width: 100%;
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: var(--radius-btn);
            padding: 15px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
        }

        .btn:active {
            background: #F0F0F0;
            transform: scale(0.98);
        }

        .btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }
        .btn:disabled:active {
            transform: none;
        }

        .btn-icon {
            padding: 8px 10px;
            font-size: 13px;
            width: auto;
            border-radius: 12px;
        }

        .btn.primary {
            background: var(--primary);
            color: #FFFFFF;
            border-color: var(--primary);
        }

        .btn.primary:active {
            background: #333333;
            border-color: #333333;
        }

        /* Specifically for Rename Button to perfectly match the select input */
        .btn-stretch {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
            border-radius: var(--radius-input); /* Match the heavy 16px radius */
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        
        .btn-stretch:active {
            background: #F0F0F0;
            transform: scale(0.98);
        }

        .btn-sm {
            padding: 8px 14px;
            font-size: 12px;
            width: auto;
            border-radius: 12px;
        }

        .dropzone {
            margin-top: 12px;
            padding: 40px 20px;
            border: 1px dashed #D4D4D4;
            border-radius: var(--radius-item);
            background: #FAFAFA;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s ease, background 0.2s ease;
        }

        .dropzone.dragover {
            border-color: var(--primary);
            background: #F0F0F0;
        }

        .dropzone-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 6px;
        }
        
        .dropzone-sub {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .file-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 450px;
            overflow-y: auto;
            margin-top: 16px;
        }

        .file-item {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-item);
            padding: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .text-thumb {
            width: 48px;
            height: 48px;
            background: #F5F5F5;
            border: 1px solid var(--border);
            border-radius: var(--radius-thumb);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 13px;
            color: var(--text-secondary);
            flex-shrink: 0;
            text-transform: uppercase;
            overflow: hidden;
        }

        .file-info {
            flex: 1;
            min-width: 0;
        }

        .file-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .file-meta {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .file-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            display: none;
            align-items: flex-end;
            justify-content: center;
            background: rgba(0,0,0,0.4);
            z-index: 3000;
            padding: 18px;
        }

        .modal-backdrop.show {
            display: flex;
        }

        .modal-sheet {
            width: min(500px, 100%);
            background: var(--card-bg);
            border-radius: 24px;
            padding: 24px 20px calc(20px + env(safe-area-inset-bottom));
            box-shadow: var(--shadow-modal);
            border: 1px solid var(--border);
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .modal-backdrop.show .modal-sheet {
            transform: translateY(0);
        }

        .modal-title {
            font-size: 17px;
            font-weight: 750;
            color: var(--primary);
            margin-bottom: 7px;
        }

        .modal-desc {
            font-size: 12px;
            line-height: 1.6;
            color: var(--text-secondary);
            margin-bottom: 20px;
            word-break: break-all;
        }

        .modal-actions-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        #toast {
            position: fixed;
            top: calc(24px + env(safe-area-inset-top));
            left: 50%;
            transform: translate(-50%, -24px);
            background: #1C1C1E;
            color: #ffffff;
            padding: 13px 18px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 600;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.38s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 9999;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        #toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #E0E0E0; border-radius: 4px; }
        
        .hidden { display: none !important; }
        
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container" id="main-container">
    
    <!-- Settings Card -->
    <div class="card" id="card-settings">
        <h2 class="title">Settings</h2>
        <p class="sub">配置 GitHub 密钥以管理您的仓库与文件。</p>
        
        <div class="input-group">
            <label class="label">GitHub Token</label>
            <input type="password" id="gh-token" class="input-field" placeholder="ghp_xxxxxxxxxxxxxxxxx" autocomplete="off">
        </div>
        
        <button class="btn primary" id="btn-verify" onclick="verifyAndFetchRepos()">验证并获取仓库</button>

        <div id="repo-section" class="input-group hidden" style="margin-top: 24px;">
            <label class="label">选择仓库</label>
            <div class="flex-row-stretch">
                <div class="select-wrapper">
                    <select id="gh-repo" class="select-field" onchange="handleRepoChange()">
                        <option value="">请选择仓库...</option>
                    </select>
                </div>
                <button class="btn-stretch" onclick="renameCurrentRepo()">重命名仓库</button>
            </div>
            <button class="btn btn-sm" id="btn-logout" style="margin-top: 16px; width: 100%;" onclick="logout()">退出登录</button>
        </div>
    </div>

    <!-- Upload Card -->
    <div class="card hidden" id="card-upload">
        <h2 class="title">Upload File</h2>
        <p class="sub">选择文件并指定路径，上传至当前选中仓库。</p>
        
        <div class="dropzone" id="drop-zone" onclick="document.getElementById('file-input').click()" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleFileDrop(event)">
            <div class="dropzone-title">点击或拖拽文件到此处</div>
            <div class="dropzone-sub" id="file-name-display">未选择文件</div>
            <input type="file" id="file-input" class="hidden" onchange="handleFileSelect(event)">
        </div>

        <div class="input-group mt-4 hidden" id="upload-details" style="margin-top: 16px;">
            <label class="label">目标路径及文件名</label>
            <input type="text" id="upload-path" class="input-field" placeholder="例如: folder/image.png">
            <button class="btn primary" id="btn-upload" style="margin-top: 8px;" onclick="uploadFile()">确认上传</button>
        </div>
    </div>

    <!-- Files Card -->
    <div class="card hidden" id="card-files">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <h2 class="title" style="margin-bottom: 0;">Repository Files</h2>
            <button class="btn btn-sm" onclick="fetchFiles()" id="btn-refresh">刷新</button>
        </div>
        <p class="sub">管理当前仓库文件：可移动、重命名或删除。</p>
        
        <input type="text" id="file-search" class="input-field" placeholder="搜索文件名..." oninput="renderFiles()" style="margin-bottom: 14px;">

        <div class="file-list" id="file-list">
            <div style="text-align: center; color: var(--text-secondary); font-size: 13px; padding: 30px 0;">配置并选择仓库后显示</div>
        </div>
    </div>
</div>

<div class="modal-backdrop" id="prompt-modal" onclick="if(event.target===this) closePrompt(null)">
    <div class="modal-sheet">
        <div class="modal-title" id="prompt-title">输入</div>
        <div class="modal-desc" id="prompt-desc">请输入内容</div>
        <div class="input-group">
            <input type="text" class="input-field" id="prompt-input" autocomplete="off">
        </div>
        <div class="modal-actions-row">
            <button class="btn" onclick="closePrompt(null)">取消</button>
            <button class="btn primary" onclick="submitPrompt()">确认</button>
        </div>
    </div>
</div>

<div class="modal-backdrop" id="confirm-modal" onclick="if(event.target===this) closeConfirm(false)">
    <div class="modal-sheet">
        <div class="modal-title" id="confirm-title">确认操作</div>
        <div class="modal-desc" id="confirm-desc">您确定要执行此操作吗？</div>
        <div class="modal-actions-row">
            <button class="btn" onclick="closeConfirm(false)">取消</button>
            <button class="btn primary" onclick="closeConfirm(true)">确认</button>
        </div>
    </div>
</div>

<div id="toast"></div>

<script>
    let state = {
        token: localStorage.getItem('gh_pure_token') || '',
        repo: localStorage.getItem('gh_pure_repo') || '',
        owner: '',
        branch: 'main',
        files: [],
        selectedFileBase64: null,
        isVerified: false
    };

    document.getElementById('gh-token').value = state.token;

    function orderKey() {
        return `gh_pure_order_${state.owner}_${state.repo}`;
    }

    function getFileOrder() {
        if (!state.repo) return [];
        try {
            return JSON.parse(localStorage.getItem(orderKey()) || '[]');
        } catch (e) {
            return [];
        }
    }

    function saveFileOrder(order) {
        if (!state.repo) return;
        localStorage.setItem(orderKey(), JSON.stringify(order));
    }

    // Merge saved order with current file list: drop paths that no longer
    // exist, append any new paths (alphabetically) at the end, and persist
    // the merged result so future renders stay stable.
    function getMergedOrder() {
        const pathSet = new Set(state.files.map(f => f.path));
        const saved = getFileOrder().filter(p => pathSet.has(p));
        const known = new Set(saved);
        const remaining = state.files
            .filter(f => !known.has(f.path))
            .sort((a, b) => a.path.localeCompare(b.path))
            .map(f => f.path);
        const merged = saved.concat(remaining);
        saveFileOrder(merged);
        return merged;
    }

    function moveFileOrderPosition(index, delta) {
        const order = getFileOrder();
        const newIndex = index + delta;
        if (newIndex < 0 || newIndex >= order.length) return;
        [order[index], order[newIndex]] = [order[newIndex], order[index]];
        saveFileOrder(order);
        renderFiles();
    }

    function showToast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(el._t);
        el._t = setTimeout(() => el.classList.remove('show'), 2500);
    }

    let promptResolver = null;
    let confirmResolver = null;

    function customPrompt(title, desc, defaultValue = '') {
        return new Promise(resolve => {
            document.getElementById('prompt-title').textContent = title;
            document.getElementById('prompt-desc').textContent = desc;
            const input = document.getElementById('prompt-input');
            input.value = defaultValue;
            document.getElementById('prompt-modal').classList.add('show');
            input.focus();
            promptResolver = resolve;
        });
    }

    function submitPrompt() {
        const val = document.getElementById('prompt-input').value.trim();
        closePrompt(val || null);
    }

    function closePrompt(value) {
        document.getElementById('prompt-modal').classList.remove('show');
        if (promptResolver) {
            promptResolver(value);
            promptResolver = null;
        }
    }

    function customConfirm(title, desc) {
        return new Promise(resolve => {
            document.getElementById('confirm-title').textContent = title;
            document.getElementById('confirm-desc').textContent = desc;
            document.getElementById('confirm-modal').classList.add('show');
            confirmResolver = resolve;
        });
    }

    function closeConfirm(isConfirm) {
        document.getElementById('confirm-modal').classList.remove('show');
        if (confirmResolver) {
            confirmResolver(isConfirm);
            confirmResolver = null;
        }
    }

    async function ghFetch(path, options = {}) {
        if (!state.token) throw new Error("缺少 GitHub Token");
        
        const headers = {
            'Accept': 'application/vnd.github+json',
            'Authorization': `Bearer ${state.token}`,
            'X-GitHub-Api-Version': '2022-11-28',
            ...(options.headers || {})
        };

        const res = await fetch(`https://api.github.com${path}`, { ...options, headers });
        let data;
        try { data = await res.json(); } catch(e) { data = {}; }
        
        if (!res.ok) {
            throw new Error(data.message || `请求失败: ${res.status}`);
        }
        return data;
    }

    function applyVerifiedLayout() {
        if (state.isVerified) {
            const container = document.getElementById('main-container');
            const cardSettings = document.getElementById('card-settings');
            
            document.getElementById('card-upload').classList.remove('hidden');
            document.getElementById('card-upload').classList.add('fade-in');
            
            document.getElementById('card-files').classList.remove('hidden');
            document.getElementById('card-files').classList.add('fade-in');

            // Move settings card to the very bottom
            container.appendChild(cardSettings);
        }
    }

    async function verifyAndFetchRepos() {
        const tokenInput = document.getElementById('gh-token').value.trim();
        if (!tokenInput) return showToast("请填写 Token");
        
        state.token = tokenInput;
        localStorage.setItem('gh_pure_token', state.token);
        const btn = document.getElementById('btn-verify');
        btn.textContent = "验证中...";
        btn.disabled = true;

        try {
            const user = await ghFetch('/user');
            state.owner = user.login;

            await populateRepoSelect();
            document.getElementById('repo-section').classList.remove('hidden');
            
            state.isVerified = true;
            applyVerifiedLayout();
            showToast("验证成功，仓库已加载");
        } catch (error) {
            state.isVerified = false;
            showToast("验证失败: " + error.message);
            document.getElementById('repo-section').classList.add('hidden');
        } finally {
            btn.textContent = "验证并获取仓库";
            btn.disabled = false;
        }
    }

    async function populateRepoSelect() {
        const repos = await ghFetch('/user/repos?per_page=100&sort=updated');
        const select = document.getElementById('gh-repo');
        select.innerHTML = '<option value="">请选择仓库...</option>';
        
        let foundSaved = false;
        repos.forEach(r => {
            const opt = document.createElement('option');
            opt.value = r.name;
            opt.textContent = r.name;
            select.appendChild(opt);
            if (state.repo === r.name) foundSaved = true;
        });

        if (state.repo && foundSaved) {
            select.value = state.repo;
            fetchFiles();
        } else {
            state.repo = '';
            document.getElementById('file-list').innerHTML = '<div style="text-align: center; color: var(--text-secondary); font-size: 13px; padding: 30px 0;">请从上方选择一个仓库</div>';
        }
    }

    function handleRepoChange() {
        const select = document.getElementById('gh-repo');
        state.repo = select.value;
        if (state.repo) {
            localStorage.setItem('gh_pure_repo', state.repo);
            fetchFiles();
        }
    }

    async function renameCurrentRepo() {
        if (!state.repo) return showToast("请先选择一个仓库");
        const newName = await customPrompt("重命名仓库", `当前仓库名：${state.repo}\n请输入新的仓库名（不支持中文及特殊符号）：`, state.repo);
        if (!newName || newName === state.repo) return;

        showToast("正在重命名...");
        try {
            const res = await ghFetch(`/repos/${state.owner}/${state.repo}`, {
                method: 'PATCH',
                body: JSON.stringify({ name: newName })
            });
            
            showToast("仓库重命名成功");
            state.repo = res.name;
            localStorage.setItem('gh_pure_repo', state.repo);
            await populateRepoSelect();
            
        } catch (error) {
            showToast("重命名失败: " + error.message);
        }
    }

    function logout() {
        localStorage.removeItem('gh_pure_token');
        localStorage.removeItem('gh_pure_repo');
        state.token = '';
        state.repo = '';
        state.owner = '';
        state.files = [];
        state.isVerified = false;
        state.selectedFileBase64 = null;

        document.getElementById('gh-token').value = '';
        document.getElementById('gh-repo').innerHTML = '<option value="">请选择仓库...</option>';
        document.getElementById('repo-section').classList.add('hidden');
        document.getElementById('card-upload').classList.add('hidden');
        document.getElementById('card-files').classList.add('hidden');
        document.getElementById('file-list').innerHTML = '<div style="text-align: center; color: var(--text-secondary); font-size: 13px; padding: 30px 0;">配置并选择仓库后显示</div>';

        const container = document.getElementById('main-container');
        const cardSettings = document.getElementById('card-settings');
        container.insertBefore(cardSettings, container.firstChild);

        showToast("已退出登录");
    }

    if (state.token) {
        verifyAndFetchRepos();
    }

    function handleDragOver(e) {
        e.preventDefault();
        document.getElementById('drop-zone').classList.add('dragover');
    }

    function handleDragLeave() {
        document.getElementById('drop-zone').classList.remove('dragover');
    }

    function handleFileDrop(e) {
        e.preventDefault();
        document.getElementById('drop-zone').classList.remove('dragover');
        if (e.dataTransfer.files.length) {
            processFile(e.dataTransfer.files[0]);
        }
    }

    function handleFileSelect(e) {
        if (e.target.files.length) {
            processFile(e.target.files[0]);
        }
    }

    function processFile(file) {
        document.getElementById('file-name-display').textContent = file.name;
        document.getElementById('upload-path').value = file.name;
        document.getElementById('upload-details').classList.remove('hidden');
        
        const reader = new FileReader();
        reader.onload = (ev) => {
            state.selectedFileBase64 = ev.target.result.split(',')[1];
        };
        reader.readAsDataURL(file);
    }

    async function uploadFile() {
        if (!state.repo) return showToast("请先选择仓库");
        if (!state.selectedFileBase64) return showToast("请先选择文件");
        
        const path = document.getElementById('upload-path').value.trim();
        if (!path) return showToast("请填写目标路径");

        const btn = document.getElementById('btn-upload');
        btn.textContent = "正在上传...";
        btn.disabled = true;

        try {
            const existing = state.files.find(f => f.path === path);
            const body = {
                message: `Upload ${path}`,
                content: state.selectedFileBase64
            };
            if (existing) body.sha = existing.sha;

            try {
                await ghFetch(`/repos/${state.owner}/${state.repo}/contents/${encodeURIComponent(path)}`, {
                    method: 'PUT',
                    body: JSON.stringify(body)
                });
            } catch (err) {
                // Local file list may be stale — if GitHub says a sha is
                // required (file already exists), fetch it and retry once.
                if (!existing && /sha/i.test(err.message)) {
                    const current = await ghFetch(`/repos/${state.owner}/${state.repo}/contents/${encodeURIComponent(path)}`);
                    body.sha = current.sha;
                    await ghFetch(`/repos/${state.owner}/${state.repo}/contents/${encodeURIComponent(path)}`, {
                        method: 'PUT',
                        body: JSON.stringify(body)
                    });
                } else {
                    throw err;
                }
            }

            showToast(existing ? "已覆盖同名文件" : "文件上传成功");
            
            document.getElementById('file-input').value = '';
            document.getElementById('file-name-display').textContent = '点击选择文件';
            document.getElementById('upload-path').value = '';
            document.getElementById('upload-details').classList.add('hidden');
            state.selectedFileBase64 = null;
            
            fetchFiles(); 
        } catch (error) {
            showToast("上传失败: " + error.message);
        } finally {
            btn.textContent = "确认上传";
            btn.disabled = false;
        }
    }

    function getThumbText(filename) {
        if (/\.(png|jpe?g|gif|webp|svg|bmp|avif)$/i.test(filename)) return 'IMG';
        if (/\.(ttf|otf|woff2?|eot)$/i.test(filename)) return 'Aa';
        if (/\.(js|ts|jsx|tsx)$/i.test(filename)) return 'JS';
        if (/\.(css|scss|less)$/i.test(filename)) return 'CSS';
        if (/\.(html|htm)$/i.test(filename)) return 'HTML';
        if (/\.(md|mdx)$/i.test(filename)) return 'MD';
        
        const parts = filename.split('.');
        if (parts.length > 1) {
            return parts.pop().slice(0, 4).toUpperCase();
        }
        return 'FILE';
    }

    async function fetchFiles() {
        if (!state.repo || !state.owner) return;
        
        const listEl = document.getElementById('file-list');
        listEl.innerHTML = '<div style="text-align: center; color: var(--text-secondary); font-size: 13px; padding: 30px 0;">读取中...</div>';
        
        try {
            const repoInfo = await ghFetch(`/repos/${state.owner}/${state.repo}`);
            state.branch = repoInfo.default_branch || 'main';

            const treeData = await ghFetch(`/repos/${state.owner}/${state.repo}/git/trees/${state.branch}?recursive=1`);
            state.files = (treeData.tree || []).filter(item => item.type === 'blob');
            renderFiles();
        } catch (error) {
            listEl.innerHTML = `<div style="text-align: center; color: #FF3B30; font-size: 13px; padding: 30px 0;">获取失败: ${error.message}</div>`;
        }
    }

    function renderFiles() {
        const listEl = document.getElementById('file-list');
        listEl.innerHTML = '';
        
        if (state.files.length === 0) {
            listEl.innerHTML = '<div style="text-align: center; color: var(--text-secondary); font-size: 13px; padding: 30px 0;">仓库为空或无文件</div>';
            return;
        }

        const orderedPaths = getMergedOrder();
        const sorted = orderedPaths.map(p => state.files.find(f => f.path === p)).filter(Boolean);

        const searchInput = document.getElementById('file-search');
        const query = searchInput ? searchInput.value.trim().toLowerCase() : '';
        const visible = sorted
            .map((file, idx) => ({ file, idx }))
            .filter(({ file }) => !query || file.path.toLowerCase().includes(query));

        if (visible.length === 0) {
            listEl.innerHTML = '<div style="text-align: center; color: var(--text-secondary); font-size: 13px; padding: 30px 0;">没有匹配的文件</div>';
            return;
        }

        visible.forEach(({ file, idx }) => {
            const item = document.createElement('div');
            item.className = 'file-item';
            
            const thumb = document.createElement('div');
            thumb.className = 'text-thumb';
            if (/\.(png|jpe?g|gif|webp|avif)$/i.test(file.path)) {
                const img = document.createElement('img');
                img.style.width = '100%';
                img.style.height = '100%';
                img.style.objectFit = 'cover';
                img.loading = 'lazy';
                img.src = `https://raw.githubusercontent.com/${state.owner}/${state.repo}/${state.branch}/${file.path.split('/').map(encodeURIComponent).join('/')}`;
                img.onerror = () => {
                    thumb.innerHTML = '';
                    thumb.textContent = getThumbText(file.path);
                };
                thumb.appendChild(img);
            } else {
                thumb.textContent = getThumbText(file.path);
            }
            
            const info = document.createElement('div');
            info.className = 'file-info';
            
            const nameEl = document.createElement('div');
            nameEl.className = 'file-name';
            nameEl.textContent = file.path;
            
            const metaEl = document.createElement('div');
            metaEl.className = 'file-meta';
            const kb = (file.size / 1024).toFixed(1);
            metaEl.textContent = `${kb} KB`;

            info.appendChild(nameEl);
            info.appendChild(metaEl);

            const actionsEl = document.createElement('div');
            actionsEl.className = 'file-actions';

            const btnUp = document.createElement('button');
            btnUp.className = 'btn btn-sm btn-icon';
            btnUp.textContent = '↑';
            btnUp.disabled = idx === 0;
            btnUp.onclick = () => moveFileOrderPosition(idx, -1);

            const btnDown = document.createElement('button');
            btnDown.className = 'btn btn-sm btn-icon';
            btnDown.textContent = '↓';
            btnDown.disabled = idx === sorted.length - 1;
            btnDown.onclick = () => moveFileOrderPosition(idx, 1);

            const btnMove = document.createElement('button');
            btnMove.className = 'btn btn-sm';
            btnMove.textContent = '重命名';
            btnMove.onclick = () => moveFile(file);

            const btnDel = document.createElement('button');
            btnDel.className = 'btn btn-sm';
            btnDel.textContent = '删除';
            btnDel.onclick = () => deleteFile(file);

            actionsEl.appendChild(btnUp);
            actionsEl.appendChild(btnDown);
            actionsEl.appendChild(btnMove);
            actionsEl.appendChild(btnDel);

            item.appendChild(thumb);
            item.appendChild(info);
            item.appendChild(actionsEl);
            listEl.appendChild(item);
        });
    }

    async function moveFile(file) {
        const newPath = await customPrompt("重命名 / 移动文件", "请输入新的完整路径及文件名：", file.path);
        if (!newPath || newPath === file.path) return;

        showToast("正在获取原文件...");
        try {
            const fileData = await ghFetch(`/repos/${state.owner}/${state.repo}/contents/${encodeURIComponent(file.path)}`);
            if (!fileData.content) throw new Error("无法读取原文件内容");

            showToast("正在建立新文件...");
            await ghFetch(`/repos/${state.owner}/${state.repo}/contents/${encodeURIComponent(newPath)}`, {
                method: 'PUT',
                body: JSON.stringify({
                    message: `Rename ${file.path} to ${newPath}`,
                    content: fileData.content.replace(/\n/g, '') 
                })
            });

            await ghFetch(`/repos/${state.owner}/${state.repo}/contents/${encodeURIComponent(file.path)}`, {
                method: 'DELETE',
                body: JSON.stringify({
                    message: `Clean up old file ${file.path}`,
                    sha: file.sha 
                })
            });

            const order = getFileOrder();
            const pos = order.indexOf(file.path);
            if (pos !== -1) {
                order[pos] = newPath;
                saveFileOrder(order);
            }

            showToast("移动/重命名成功");
            fetchFiles();
        } catch (error) {
            showToast("操作中断: " + error.message);
            fetchFiles(); 
        }
    }

    async function deleteFile(file) {
        const confirmed = await customConfirm("删除文件", `您确定要永久删除 ${file.path} 吗？此操作无法撤销。`);
        if (!confirmed) return;

        showToast("正在删除...");
        try {
            await ghFetch(`/repos/${state.owner}/${state.repo}/contents/${encodeURIComponent(file.path)}`, {
                method: 'DELETE',
                body: JSON.stringify({
                    message: `Delete ${file.path}`,
                    sha: file.sha
                })
            });
            showToast("删除成功");
            fetchFiles();
        } catch (error) {
            showToast("删除失败: " + error.message);
        }
    }
</script>
</body>
</html>
